#####################################################################
# 	Custom Sensorless Homing
#####################################################################

[gcode_macro SENSORLESS_HOME_X]
gcode:
    # Always use consistent run_current on A/B steppers during sensorless homing
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 0.7 %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

    # Home
    G28 X
    # Move away
    G91
    G1 X-10 F1200
    
    # Wait just a second… (give StallGuard registers time to clear)
    G4 P1000
    # Set current during print
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}

[gcode_macro SENSORLESS_HOME_Y]
gcode:
    # Set current for sensorless homing
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 0.7 %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

    # Home
    G28 Y
    # Move away
    G91
    G1 Y-10 F1200

    # Wait just a second… (give StallGuard registers time to clear)
    G4 P1000
    # Set current during print
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}


[homing_override]
axes: xyz
gcode:
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

  {% if home_all or 'X' in params %}
    SENSORLESS_HOME_X
  {% endif %}
  
  {% if home_all or 'Y' in params %}
    SENSORLESS_HOME_Y
  {% endif %}
  
  {% if home_all or 'Z' in params %}
    G0 X-175 Y-175 F12000
    G28 Z
    G1 Z10
  {% endif %}

[bed_mesh]
speed: 300
horizontal_move_z: 10
##--------------------------------------------------------------------
##	Uncomment below for 250mm build
#mesh_min: 40, 40
#mesh_max: 210,210
#zero_reference_position: 125,125 #for use with stock z endstop

##	Uncomment for 300mm build
#mesh_min: 40, 40
#mesh_max: 260,260
#zero_reference_position: 150,150 #for use with stock z endstop

##	Uncomment for 350mm build
mesh_min: 40, 40
mesh_max: 310,310

##--------------------------------------------------------------------
fade_start: 0.6
fade_end: 10.0
probe_count: 5,5 # Values should be odd, so one point is directly at bed center
algorithm: bicubic

#####################################################################
# 	Clean Nozzle
#####################################################################

[gcode_macro CLEAN_NOZZLE]
variable_start_x: 145
variable_start_y: 360
variable_start_z: 2
variable_wipe_dist: -50
variable_wipe_qty: 10
variable_wipe_spd: 200
variable_raise_distance: 30

gcode:
## Home if not homed
 {% if "xyz" not in printer.toolhead.homed_axes %}
   G28
 {% endif %}

 # Set Nozzle temperature to 170 for more effective cleaning
 M109 S170
 G90                                            ; absolute positioning
 ## Move nozzle to start position
 G1 X{start_x} Y{start_y} F6000
 G1 Z{start_z} F1500

 ## Wipe nozzle
 {% for wipes in range(1, (wipe_qty + 1)) %}
   G1 X{start_x + wipe_dist} F{wipe_spd * 60}
   G1 X{start_x} F{wipe_spd * 60}
 {% endfor %}

 ## Raise nozzle
 G1 Z{raise_distance}

#####################################################################
# 	Smart Filament Sensor
#####################################################################

[filament_motion_sensor SFS_T0]
detection_length: 15.00 ; This can be adjusted to your desired level of sensitivity. 10 is a recommended value to prevent flow dropoff false triggers.
extruder: extruder
switch_pin: ^PG10
## Setting this to False does NOT make a monitor mode on its own: runout_gcode below still runs, and it calls PAUSE.
pause_on_runout: True 
event_delay: 3.0
pause_delay: 0.5
runout_gcode:
    #LCDRGB R=1 G=0 B=0  ; Turn LCD red TODO: USE ERROR COLOR MACRO
    SFS_LOG_TRIP         ; record the print state first, before PAUSE parks the head
    M117 Runout Detected!
    PAUSE
    #BEEP I=12           ; Beep 12 times DOn't have one but would be nice

## Trip log for diagnosing false runouts (voron_2.4 docs/upgrade-plan.md F6).
## sfs_trips.cfg sits in the config dir, so klipper-backup pushes every trip to GitHub.
[save_variables]
filename: ~/printer_data/config/sfs_trips.cfg

[gcode_macro SFS_LOG_TRIP]
description: Save the print state when the filament sensor trips (keeps the last 30)
gcode:
    {% set vars = printer.save_variables.variables %}
    {% set ps = printer.print_stats %}
    {% set sd = printer.virtual_sdcard %}
    {% set gm = printer.gcode_move %}
    {% set mr = printer.motion_report %}
    {% set ex = printer.extruder %}
    {% set n = vars.sfs_trip_count|default(0) + 1 %}
    {% set trip = {
        'n': n,
        'file': ps.filename|replace(';', '')|replace('#', '')|replace('*', ''),
        'state': ps.state,
        'print_s': ps.print_duration|round(1),
        'total_s': ps.total_duration|round(1),
        'filament_mm': ps.filament_used|round(1),
        'file_pos': sd.file_position,
        'progress': sd.progress|round(4),
        'layer': ps.info.current_layer,
        'x': gm.gcode_position.x|round(1),
        'y': gm.gcode_position.y|round(1),
        'z': gm.gcode_position.z|round(2),
        'speed_mm_s': (gm.speed / 60)|round(1),
        'speed_factor': gm.speed_factor,
        'extrude_factor': gm.extrude_factor,
        'live_v': mr.live_velocity|round(1),
        'live_ev': mr.live_extruder_velocity|round(2),
        'temp': ex.temperature|round(1),
        'target': ex.target,
        'pa': ex.pressure_advance,
        'fan': printer.fan.speed|round(2),
        'detection_length': printer.configfile.settings['filament_motion_sensor sfs_t0'].detection_length,
    } %}
    {% set trips = (vars.sfs_trips|default([]) + [trip])[-30:] %}
    SAVE_VARIABLE VARIABLE=sfs_trip_count VALUE={n}
    SAVE_VARIABLE VARIABLE=sfs_trips VALUE="{ trips|pprint|replace('\n', '')|replace('"', '\\"') }"
    M118 SFS trip {n}: pos {trip.file_pos} Z {trip.z} v {trip.live_v} ev {trip.live_ev} | {trip.file}

## Where is this used?
[delayed_gcode DISABLEFILAMENTSENSOR] ; This will disable the SFS 1 second after klipper starts
initial_duration: 1
gcode:
    ## TODO: set this
    SET_FILAMENT_SENSOR SENSOR=SFS_T0 ENABLE=0 ; Put your filament sensor's name after SENSOR=

[gcode_macro SFS_ENABLE] ; Add this to PRINT_START
description: Enable smart filament sensor
gcode:
    M117 ENABLING the Smart Filament Sensor
    G92 E0
    SET_FILAMENT_SENSOR SENSOR=SFS_T0 ENABLE=1 ; Put your filament sensor's name after SENSOR=

[gcode_macro SFS_DISABLE] ; Add this to PRINT_END and PRINT_CANCEL
description: Disable smart filament sensor
gcode:
    M117 DISABLING the Smart Filament Sensor
    G92 E0
    SET_FILAMENT_SENSOR SENSOR=SFS_T0 ENABLE=0 ; Put your filament sensor's name after SENSOR=

[gcode_macro SET_ACTIVE_SPOOL]
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
    {action_call_remote_method(
       "spoolman_set_active_spool",
       spool_id=id
    )}
  {% else %}
    {action_respond_info("Parameter 'ID' is required")}
  {% endif %}

#####################################################################
